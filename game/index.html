<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Azura Bay — an open-world crime story</title>
<style>
  html, body { margin: 0; padding: 0; background: #0a0e1c; height: 100%; overflow: hidden; }

</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<pre id="selftest"></pre>
